name: Build & Publish Signed Release

# Triggers only when version.properties changes (i.e. when you actually
# bump the version to publish an update), plus a manual button so you can
# re-run it any time from the Actions tab.
on:
  push:
    branches: [ main, master ]
    paths:
      - 'version.properties'
  workflow_dispatch: {}

permissions:
  contents: write   # needed to publish a GitHub Release

jobs:
  release:
    name: Build signed APK & publish update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Add native Android platform
        run: npx cap add android

      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Sync web assets into the native project
        run: npx cap sync android

      - name: Apply icon, splash, versioning, permissions & update system
        run: node scripts/customize-android.js

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x android/gradlew

      - name: Build signed release APK
        working-directory: android
        env:
          RELEASE_KEYSTORE_PATH: release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Generate version.json
        run: node scripts/generate-version-json.js

      - name: Collect release assets
        id: assets
        run: |
          cp android/app/build/outputs/apk/release/app-release*.apk app-release.apk
          . <(grep -E '^(versionCode|versionName)=' version.properties)
          echo "versionCode=$versionCode" >> "$GITHUB_OUTPUT"
          echo "versionName=$versionName" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.assets.outputs.versionName }}-${{ steps.assets.outputs.versionCode }}
          name: "تحدّي الثانية v${{ steps.assets.outputs.versionName }}"
          files: |
            app-release.apk
            version.json
