name: Build & Publish Signed Release

# Triggers only when version.properties changes (i.e. when you actually
# bump the version to publish an update), plus a manual button so you can
# re-run it any time from the Actions tab.
on:
  push:
    branches: [ main, master ]
    paths:
      - 'version.properties'
  workflow_dispatch: {}

permissions:
  contents: write   # needed to publish a GitHub Release

jobs:
  release:
    name: Build signed APK & publish update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Add native Android platform
        run: npx cap add android

      # GitHub Secrets pasted through certain UIs (or a text editor along the
      # way) can silently pick up a trailing space/newline or CRLF line
      # endings — invisible to the eye, but Java's keystore decryption is
      # byte-exact and will reject it. This step strips ALL whitespace from
      # every signing secret before anything touches them, so the build is
      # immune to that class of copy-paste corruption regardless of cause.
      - name: Sanitize signing secrets
        run: |
          clean_b64=$(printf '%s' "$RAW_B64" | tr -d '[:space:]')
          clean_pass=$(printf '%s' "$RAW_PASS" | tr -d '[:space:]')
          clean_alias=$(printf '%s' "$RAW_ALIAS" | tr -d '[:space:]')
          clean_keypass=$(printf '%s' "$RAW_KEYPASS" | tr -d '[:space:]')
          echo "::add-mask::$clean_b64"
          echo "::add-mask::$clean_pass"
          echo "::add-mask::$clean_alias"
          echo "::add-mask::$clean_keypass"
          {
            echo "CLEAN_KEYSTORE_BASE64=$clean_b64"
            echo "CLEAN_KEYSTORE_PASSWORD=$clean_pass"
            echo "CLEAN_KEY_ALIAS=$clean_alias"
            echo "CLEAN_KEY_PASSWORD=$clean_keypass"
          } >> "$GITHUB_ENV"
        env:
          RAW_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RAW_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RAW_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RAW_KEYPASS: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Decode release keystore
        run: printf '%s' "$CLEAN_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      # Fails fast with a clear message here (a few seconds in) instead of
      # deep inside a Gradle signing task after a multi-minute build.
      - name: Verify keystore + password actually match before building
        run: |
          if ! keytool -list -keystore android/app/release.keystore \
                -storepass "$CLEAN_KEYSTORE_PASSWORD" \
                -alias "$CLEAN_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The RELEASE_KEYSTORE_BASE64 / RELEASE_KEYSTORE_PASSWORD / RELEASE_KEY_ALIAS secrets do not match this keystore. Re-check all three secrets in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Keystore verified — alias '$CLEAN_KEY_ALIAS' opens correctly with the supplied password."

      - name: Sync web assets into the native project
        run: npx cap sync android

      - name: Apply icon, splash, versioning, permissions & update system
        run: node scripts/customize-android.js

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x android/gradlew

      - name: Build signed release APK
        working-directory: android
        env:
          RELEASE_KEYSTORE_PATH: release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ env.CLEAN_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ env.CLEAN_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ env.CLEAN_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Generate version.json
        run: node scripts/generate-version-json.js

      - name: Collect release assets
        id: assets
        run: |
          cp android/app/build/outputs/apk/release/app-release*.apk app-release.apk
          versionCode=$(grep '^versionCode=' version.properties | cut -d= -f2)
          versionName=$(grep '^versionName=' version.properties | cut -d= -f2)
          echo "versionCode=$versionCode" >> "$GITHUB_OUTPUT"
          echo "versionName=$versionName" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.assets.outputs.versionName }}-${{ steps.assets.outputs.versionCode }}
          name: "تحدّي الثانية v${{ steps.assets.outputs.versionName }}"
          files: |
            app-release.apk
            version.json
